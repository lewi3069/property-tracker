name: Android checks

on:
  push:
    branches: [main]
    paths: ['app/**', 'mobile/**', 'gradle/**', '*.gradle*', 'gradle.properties', 'gradlew*', 'scripts/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'mobile/**', 'gradle/**', '*.gradle*', 'gradle.properties', 'gradlew*', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare SDK and disposable debug key
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          mkdir -p .tools
          keytool -genkeypair -noprompt -keystore .tools/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Property Tracker CI,O=Build Verification,C=US'
      - name: Check diagnostic summaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Windows build script syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "Invalid PowerShell syntax in $($script.Name): $parseErrors" }
          }
      - name: Test, build and lint TV and phone
        run: >-
          gradle --no-daemon --console=plain
          :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          :mobile:testDebugUnitTest :mobile:assembleDebug :mobile:lintDebug
      - name: Verify package identities, SDK levels and native libraries
        run: python3 scripts/verify-debug-apks.py --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
            mobile/build/reports/
            mobile/build/test-results/
          if-no-files-found: warn
          retention-days: 7
