plugins { id 'com.android.application' }
apply from: rootProject.file('gradle/android-common.gradle')

android {
    defaultConfig {
        applicationId 'com.fieldview.tv'
        minSdk 22
        buildConfigField 'boolean', 'TV_INTERFACE', 'true'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    sourceSets.main.java.srcDirs += ['src/tv/java']
}
dependencies { implementation 'org.videolan.android:libvlc-all:3.7.7' }
