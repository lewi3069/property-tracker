plugins {
    id 'com.android.application' version '8.10.1' apply false
}
ext.propertyTrackerVersion = '0.2.1'
ext.propertyTrackerVersionCode = 22

subprojects {
    if (providers.gradleProperty('propertyTrackerBuildRoot').isPresent()) {
        layout.buildDirectory.set(new File(providers.gradleProperty('propertyTrackerBuildRoot').get(), project.name))
    }
}
